[project]
name = "archbench"
version = "0.1.0"
description = "Minimal benchmark for sequence-mixing architectures on language modeling"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "deepspeed>=0.14",
    "numpy",
    "pyyaml",
    "wandb",
    "datasets",
    "transformers",
    "tqdm",
]

[project.optional-dependencies]
fla = ["flash-linear-attention"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archbench*"]
