model:
  d_model: 512
  n_layer: 8
  mlp: true
  mlp_ratio: 4.0
  tie_embeddings: true

data:
  path: data/fineweb_edu
  seq_len: 1024

optim:
  name: muon_adamw
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 500
  grad_clip: 1.0
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_weight_decay: 0.0

deepspeed:
  zero_stage: 0

train:
  steps: 5000
  batch_size: 32
  grad_accum: 1
  eval_every: 250
  eval_steps: 32
  log_every: 10
  ckpt_every: 1000
  log_dir: logs
  ckpt_dir: ~/checkpoints/archbench
  compile: false
  dtype: bfloat16
  peak_tflops: null

wandb:
  project: archbench
  mode: online
